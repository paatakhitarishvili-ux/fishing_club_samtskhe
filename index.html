resetSent:{ka:'აღდგენის ბმული გაიგზავნა შენს ელ. ფოსტაზე',en:'A reset link has been sent to your email',ru:'Ссылка для сброса пароля отправлена на вашу почту'},
authErrInvalidEmail:{ka:'ელ. ფოსტის ფორმატი არასწორია',en:'Invalid email address',ru:'Неверный формат эл. почты'},
authErrUserNotFound:{ka:'ასეთი მომხმარებელი ვერ მოიძებნა',en:'No account found with this email',ru:'Пользователь с таким email не найден'},
authErrWrongPassword:{ka:'პაროლი არასწორია',en:'Incorrect password',ru:'Неверный пароль'},
authErrEmailInUse:{ka:'ეს ელ. ფოსტა უკვე რეგისტრირებულია',en:'This email is already registered',ru:'Этот email уже зарегистрирован'},
authErrWeakPassword:{ka:'პაროლი ძალიან მოკლეა (მინ. 6 სიმბოლო)',en:'Password is too weak (min. 6 characters)',ru:'Пароль слишком короткий (мин. 6 символов)'},
authErrPasswordMismatch:{ka:'პაროლები არ ემთხვევა',en:'Passwords do not match',ru:'Пароли не совпадают'},
authErrGeneric:{ka:'დაფიქსირდა შეცდომა, სცადე ხელახლა',en:'Something went wrong, please try again',ru:'Произошла ошибка, попробуйте снова'},
authErrTooMany:{ka:'ბევრი მცდელობა — სცადე მოგვიანებით',en:'Too many attempts — try again later',ru:'Слишком много попыток — попробуйте позже'},
registerBtn:{ka:'რეგისტრაცია',en:'Register',ru:'Зарегистрироваться'},
};
function tr(k){return (UI[k]&&(UI[k][LANG]||UI[k].ka))||''}
function authErrMsg(code){
 const m={'auth/invalid-email':'authErrInvalidEmail','auth/user-not-found':'authErrUserNotFound','auth/wrong-password':'authErrWrongPassword','auth/invalid-credential':'authErrWrongPassword','auth/email-already-in-use':'authErrEmailInUse','auth/weak-password':'authErrWeakPassword','auth/too-many-requests':'authErrTooMany'};
 return tr(m[code]||'authErrGeneric');
}
function renderAuthBox(){
 const el=document.getElementById('authbox');if(!el)return;
 if(CUR_USER){
  const nm=CUR_USER.displayName||CUR_USER.email||'';
  const photo=CUR_USER.photoURL;
  const initial=(nm||'?').trim().charAt(0).toUpperCase();
  el.innerHTML=`<div class="userchip" id="userchip" tabindex="0"><span class="av">${photo?`<img src="${photo}" alt="">`:initial}</span><span>${nm}</span><small>▾</small></div>`;
  const chip=el.querySelector('#userchip');
  if(chip)chip.onclick=()=>{if(confirm(tr('logoutBtn')+'?'))fbAuth&&fbAuth.signOut()};
 }else{
  el.innerHTML=`<button class="authbtn" id="loginTrigger">${tr('loginBtn')}</button>`;
  const btn=el.querySelector('#loginTrigger');
  if(btn)btn.onclick=()=>authModal();
 }
}
function authModal(mode0){
 let mode=mode0||'login';
 const o=document.createElement('div');o.className='ov';
 const close=()=>{o.remove();document.removeEventListener('keydown',k)},k=e=>{if(e.key==='Escape')close()};
 const render=()=>{
  const isLogin=mode==='login',isReg=mode==='register',isForgot=mode==='forgot';
  o.innerHTML=`<div class="md" role="dialog" aria-modal="true" style="max-width:380px">
   <div class="hd"><h3>${isForgot?tr('forgotPassword'):tr('loginTab')+' / '+tr('registerTab')}</h3><button class="x" aria-label="${tr('close')}">✕</button></div>
   ${isForgot?'':`<div class="authtabs"><button type="button" data-m="login" class="${isLogin?'on':''}">${tr('loginTab')}</button><button type="button" data-m="register" class="${isReg?'on':''}">${tr('registerTab')}</button></div>`}
   <form class="authform" id="authform">
    ${isReg?`<input type="text" id="af_name" placeholder="${tr('nameLabel')}" autocomplete="name">`:''}
    <input type="email" id="af_email" placeholder="${tr('emailLabel')}" autocomplete="email" required>
    ${isForgot?'':`<input type="password" id="af_pw" placeholder="${tr('passwordLabel')}" autocomplete="${isReg?'new-password':'current-password'}" required>`}
    ${isReg?`<input type="password" id="af_pw2" placeholder="${tr('confirmPasswordLabel')}" autocomplete="new-password" required>`:''}
    <div class="err" id="af_err" hidden></div>
    <div class="ok" id="af_ok" hidden></div>
    <button type="submit" class="btn pbtn">${isForgot?tr('sendResetLink'):isReg?tr('registerBtn'):tr('loginBtn')}</button>
   </form>
   ${isForgot?`<button type="button" class="authlink" id="af_back">${tr('backToLogin')}</button>`:`
   <div class="authsep">${LANG==='ka'?'ან':LANG==='ru'?'или':'or'}</div>
   <button type="button" class="glbtn" id="af_google"><svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 01-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.81.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.98v2.33A9 9 0 009 18z"/><path fill="#FBBC05" d="M3.97 10.72A5.4 5.4 0 013.68 9c0-.6.1-1.18.29-1.72V4.95H.98A9 9 0 000 9c0 1.45.35 2.83.98 4.05l2.99-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.9 11.43 0 9 0A9 9 0 00.98 4.95l2.99 2.33C4.68 5.16 6.66 3.58 9 3.58z"/></svg>${tr('continueWithGoogle')}</button>
   <div style="text-align:center;margin-top:10px"><button type="button" class="authlink" id="af_forgot" style="display:inline">${tr('forgotPassword')}</button></div>`}
  </div>`;
  const xb=o.querySelector('.x');if(xb)xb.onclick=close;
  const fm=o.querySelector('#authform');
  fm.onsubmit=async e=>{
   e.preventDefault();
   const err=o.querySelector('#af_err'),ok=o.querySelector('#af_ok');
   err.hidden=true;ok.hidden=true;
   const email=o.querySelector('#af_email').value.trim();
   if(!fbAuth){err.textContent=tr('authErrGeneric');err.hidden=false;return}
   try{
    if(isForgot){
     await fbAuth.sendPasswordResetEmail(email);
     ok.textContent=tr('resetSent');ok.hidden=false;
    }else if(isReg){
     const pw=o.querySelector('#af_pw').value,pw2=o.querySelector('#af_pw2').value,name=o.querySelector('#af_name').value.trim();
     if(pw!==pw2){err.textContent=tr('authErrPasswordMismatch');err.hidden=false;return}
     const cred=await fbAuth.createUserWithEmailAndPassword(email,pw);
     if(name&&cred.user)await cred.user.updateProfile({displayName:name});
     close();
    }else{
     const pw=o.querySelector('#af_pw').value;
     await fbAuth.signInWithEmailAndPassword(email,pw);
     close();
    }
   }catch(ex){
    err.textContent=authErrMsg(ex&&ex.code);err.hidden=false;
   }
  };
  if(!isForgot){
   o.querySelectorAll('.authtabs button').forEach(b=>b.onclick=()=>{mode=b.dataset.m;render()});
   const gb=o.querySelector('#af_google');
   if(gb)gb.onclick=async()=>{
    const err=o.querySelector('#af_err');err.hidden=true;
    if(!fbAuth)return;
    try{
     const provider=new firebase.auth.GoogleAuthProvider();
     await fbAuth.signInWithPopup(provider);
     close();
    }catch(ex){err.textContent=authErrMsg(ex&&ex.code);err.hidden=false}
   };
   const fgb=o.querySelector('#af_forgot');
   if(fgb)fgb.onclick=()=>{mode='forgot';render()};
  }else{
   const bk=o.querySelector('#af_back');
   if(bk)bk.onclick=()=>{mode='login';render()};
  }
 };
 o.onclick=e=>{if(e.target===o)close()};
 document.addEventListener('keydown',k);
 render();
 document.body.appendChild(o);
}
function renderNav(){
 const active=document.querySelector('#nav button.on,#navMoreMenu button.on');
 const activeK=active?active.dataset.k:(location.hash.slice(1)||'forecast');
 $('#nav').innerHTML=TABS.map(([k])=>`<button data-k="${k}">${NAV_ICONS[k]||''}<span>${tabLabel(k)}</span></button>`).join('')+`<button type="button" class="navMore" id="navMore"><span>${moreLabel()}</span><svg class="navMoreCaret" viewBox="0 0 10 6" width="10" height="6" aria-hidden="true"><path d="M1 1l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button>`;
 if(!$('#navMoreMenu'))$('#nav').insertAdjacentHTML('afterend','<div class="navMoreMenu" id="navMoreMenu" hidden></div>');
 document.querySelectorAll('#nav>button[data-k]').forEach(b=>b.classList.toggle('on',b.dataset.k===activeK));
 layoutNav();
}
function setLang(l){
 if(l===LANG)return;
 LANG=l;store.set('lang',l);
 buildFish();LOCS=buildLocs();
 document.querySelectorAll('#langsw button').forEach(b=>b.classList.toggle('on',b.dataset.l===LANG));
 renderNav();
 renderAuthBox();
 go(V[location.hash.slice(1)]?location.hash.slice(1):'forecast');
}
document.querySelectorAll('#langsw button').forEach(b=>b.classList.toggle('on',b.dataset.l===LANG));
$('#langsw').addEventListener('click',e=>{const b=e.target.closest('button[data-l]');if(b)setLang(b.dataset.l)});
renderNav();
renderAuthBox();
if(fbAuth)fbAuth.onAuthStateChanged(u=>{CUR_USER=u;renderAuthBox()});
$('.bar').addEventListener('click',e=>{
 if(e.target.closest('#navMore')){setNavMoreOpen($('#navMoreMenu').hidden);return}
 const mi=e.target.closest('#navMoreMenu button[data-k]');
 if(mi){go(mi.dataset.k);return}
 const b=e.target.closest('#nav button[data-k]');
 if(b)go(b.dataset.k)
});
document.addEventListener('click',e=>{if(!e.target.closest('.bar'))setNavMoreOpen(false)});
let navRt;window.addEventListener('resize',()=>{clearTimeout(navRt);navRt=setTimeout(layoutNav,120)});
document.querySelector('.logo').onclick=()=>go('forecast');
requestAnimationFrame(layoutNav);
(async()=>{try{const r=await fetch('fish-data.json?'+Date.now(),{cache:'no-store'});if(r.ok)SHARED=await r.json()}catch{}applyEdits();go(V[location.hash.slice(1)]?location.hash.slice(1):'forecast');requestAnimationFrame(layoutNav)})();
</script>
</body>
