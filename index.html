<title>Fishing Club Samtskhe — თევზაობის პროგნოზი</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#050d1f;--s1:#0c1a33;--s2:#13264a;--ln:#1f3a66;--tx:#e8eefb;--mu:#8fa3c4;--g:#35d08a;--y:#f1c040;--r:#ef6a5b;--rad:14px}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:var(--tx);font-family:'Noto Sans Georgian',system-ui,sans-serif;font-size:15px;line-height:1.5}
body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
a{color:#6db6ff}
header{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:1px solid var(--ln)}
.bar{max-width:1100px;margin:auto;padding:10px 16px;display:flex;gap:14px;align-items:center;position:relative}
.logo{font-weight:800;white-space:nowrap}
nav{display:flex;gap:2px;overflow:hidden;flex:1;min-width:0}
nav button,.navMore{background:none;border:0;color:var(--mu);font:inherit;font-size:14px;padding:7px 9px;border-radius:99px;cursor:pointer;white-space:nowrap}
nav button.on,.navMore.on{background:var(--s2);color:var(--tx)}
.navMore{display:none;align-items:center;gap:6px;flex:none}
.navMore[data-show]{display:inline-flex}
.navMoreCaret{flex:none;transition:transform .15s}
.navMore.open .navMoreCaret{transform:rotate(180deg)}
.navMoreMenu{position:absolute;top:100%;right:16px;margin-top:6px;background:var(--s1);border:1px solid var(--ln);border-radius:12px;padding:6px;display:flex;flex-direction:column;gap:2px;min-width:200px;box-shadow:0 10px 28px #0007;z-index:60}
.navMoreMenu[hidden]{display:none}
.langsw{display:flex;gap:4px;flex:none;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:3px}
.langsw button{display:flex;align-items:center;background:none;border:0;line-height:1;padding:5px 6px;border-radius:7px;cursor:pointer;opacity:.8;transition:opacity .15s,background .15s}
.langsw button svg{display:block;border-radius:2px}
.langsw button:hover{opacity:1;background:rgba(255,255,255,.12)}
.langsw button.on{opacity:1;background:var(--s2);box-shadow:0 0 0 1px #6db6ff55}
@media(max-width:700px){.langsw button{font-size:15px;padding:4px 4px}}
.authbox{flex:none}
.authbtn{background:var(--s2);border:0;color:var(--tx);font:inherit;font-size:13px;font-weight:600;padding:8px 14px;border-radius:99px;cursor:pointer;white-space:nowrap}
.authbtn:hover{filter:brightness(1.15)}
.userchip{display:flex;align-items:center;gap:8px;background:var(--s1);border:1px solid var(--ln);border-radius:99px;padding:4px 6px 4px 4px;cursor:pointer}
.userchip .av{width:26px;height:26px;border-radius:50%;background:var(--s2);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex:none;overflow:hidden}
.userchip .av img{width:100%;height:100%;object-fit:cover}
.userchip span{font-size:13px;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.userchip small{color:var(--mu);font-size:16px;margin-right:2px}
@media(max-width:700px){.userchip span{display:none}}
.authtabs{display:flex;gap:4px;margin-bottom:14px;background:var(--bg);border-radius:10px;padding:3px}
.authtabs button{flex:1;background:none;border:0;color:var(--mu);font:inherit;font-size:13px;font-weight:600;padding:8px;border-radius:8px;cursor:pointer}
.authtabs button.on{background:var(--s2);color:var(--tx)}
.authform input{width:100%;margin-bottom:10px;box-sizing:border-box}
.authform .err{color:var(--r);font-size:13px;margin:-2px 0 10px}
.authform .ok{color:var(--g);font-size:13px;margin:-2px 0 10px}
.authform .btn{width:100%;margin-top:2px}
.glbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;background:#fff;color:#1f1f1f;border:1px solid #dadce0;border-radius:10px;padding:10px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;margin-top:10px}
.glbtn:hover{background:#f7f7f7}
.authsep{display:flex;align-items:center;gap:10px;color:var(--mu);font-size:12px;margin:14px 0}
.authsep::before,.authsep::after{content:'';flex:1;height:1px;background:var(--ln)}
.authlink{background:none;border:0;color:#6db6ff;font:inherit;font-size:13px;cursor:pointer;padding:0;text-align:left}
.navMoreMenu button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;font:inherit}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #6db6ff}
main{max-width:1100px;margin:auto;padding:20px 16px 60px}
h1{font-size:26px;font-weight:800}h2{font-size:18px;margin:24px 0 10px}
.sub{color:var(--mu);margin:2px 0 14px}.mu{color:var(--mu);font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
select,input{background:var(--s1);color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:9px 12px;font:inherit}
.btn{background:#2f7bf0;color:#fff;border:0;border-radius:10px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer}
.btn.g{background:var(--s2);color:var(--tx)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.card{background:var(--s1);border:1px solid var(--ln);border-radius:var(--rad);padding:14px}
.card h3{font-size:16px}
.tag{display:inline-block;background:var(--s2);border-radius:99px;padding:2px 10px;font-size:12px;margin:6px 4px 0 0}
.gauge{display:grid;grid-template-columns:150px 1fr;gap:20px;align-items:center;background:var(--s1);border:1px solid var(--ln);border-radius:var(--rad);padding:18px}
.dial{width:150px;height:150px;position:relative}.dial svg{width:100%;height:100%;transform:rotate(-90deg)}
.dial b{position:absolute;inset:0;display:grid;place-items:center;font-size:42px}
.dial small{position:absolute;left:0;right:0;bottom:30px;text-align:center;color:var(--mu);font-size:12px}
.fac{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.fac div{background:var(--s2);border-radius:10px;padding:8px 12px}.fac span{display:block;color:var(--mu);font-size:12px}.fac b{font-size:17px}
.hrs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.hrs button{flex:0 0 52px;background:var(--s1);border:1px solid var(--ln);border-radius:10px;padding:6px 0;color:var(--tx);font:inherit;cursor:pointer;text-align:center}
.hrs button.on{border-color:#6db6ff;background:var(--s2)}.hrs span{display:block;font-size:11px;color:var(--mu)}.hrs b{font-size:17px}
.days{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.day{background:var(--s1);border:1px solid var(--ln);border-radius:12px;padding:10px;text-align:center;color:var(--tx);font:inherit;cursor:pointer}

.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}

#map{height:64vh;min-height:360px;border-radius:var(--rad);border:1px solid var(--ln)}
.moon{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}.moon .day{cursor:default}.moon svg{width:34px;height:34px}
.hi{color:var(--g)}.mid{color:var(--y)}.lo{color:var(--r)}
.empty{color:var(--mu);padding:30px;text-align:center}
