const LOC_I18N={"tbilisi_sea":{"en":{"d":"The Tbilisi Sea (Tbilisi Reservoir) is the capital's largest fishing spot. It is home to carp, zander, wels catfish, bream and silver carp. Its large water area allows fishing both from shore and from a boat. The most popular spot among anglers in Tbilisi."},"ru":{"n":"Тбилисское море","d":"Тбилисское море (Тбилисское водохранилище) — крупнейшее место для рыбалки в столице. Здесь обитают карп, судак, сом, лещ и толстолобик. Большая площадь воды позволяет ловить как с берега, так и с лодки. Самое популярное место среди тбилисских рыболовов."}},"lisi":{"en":{"d":"Lisi Lake is one of Tbilisi's most popular recreation spots. The lake is rich in carp and crucian carp. The shore is well equipped, and fishing is allowed in designated zones. Its closeness to the city makes it ideal for evening fishing."},"ru":{"n":"Озеро Лиси","d":"Озеро Лиси — одно из самых популярных мест отдыха в Тбилиси. Озеро богато карпом и карасём. Берег благоустроен, рыбалка разрешена в отведённых зонах. Близость к городу делает его идеальным для вечерней рыбалки."}},"alazani":{"en":{"d":"The Alazani is Kakheti's main river — the best place in Georgia for catfish fishing. Slow current, deep pools and warm water. Barbel, chub, shemaya and carp also live here. Summer night fishing is especially productive."},"ru":{"n":"Река Алазани","d":"Алазани — главная река Кахетии, лучшее место в Грузии для ловли сома. Медленное течение, глубокие ямы и тёплая вода. Также обитают усач, голавль, шемая и карп. Летняя ночная рыбалка особенно результативна."}},"bazaleti":{"en":{"d":"Bazaleti Lake is located in Dusheti municipality, 878 meters above sea level. This legendary lake is home to carp, crucian carp and pike. The shores are easily accessible, with hotels and camping spots around the lake."},"ru":{"n":"Озеро Базалети","d":"Озеро Базалети находится в Душетском муниципалитете, на высоте 878 метров над уровнем моря. В этом легендарном озере обитают карп, карась и щука. Берега легкодоступны, вокруг озера расположены гостиницы и места для кемпинга."}},"mtkvari":{"en":{"d":"The Mtkvari is Georgia's main river. In the Tbilisi stretch and lower reaches it is home to wels catfish, barbel, khramulya, chub and carp. Large catfish can be caught in the deep pools. Bottom-rig fishing is the most common method."},"ru":{"n":"Река Мтквари (Кура)","d":"Мтквари (Кура) — главная река Грузии. На тбилисском участке и в нижнем течении обитают сом, усач, храмуля, голавль и карп. В глубоких ямах возможна поимка крупного сома. Донная снасть — самый распространённый способ ловли."}},"shaori":{"en":{"d":"Shaori is the pearl of Racha — a high-mountain reservoir (1130 m) at the foot of the Nakerala Ridge, surrounded by forest. It is considered the kingdom of pike and a favorite spot for spin fishermen. Crucian carp and carp also live here. Ice fishing takes place in winter."},"ru":{"n":"Шаорское водохранилище","d":"Шаори — жемчужина Рачи, высокогорное водохранилище (1130 м) у подножия Накералского хребта, окружённое лесом. Считается царством щуки и любимым местом спиннингистов. Также обитают карась и карп. Зимой здесь ловят подо льдом."}},"jandari":{"en":{"d":"Jandari Lake is located in Gardabani municipality, on the Georgia–Azerbaijan border. This warm-water lake is rich in carp, wels catfish, silver carp and grass carp. There is a high chance of catching large specimens — a popular spot for trophy fishing."},"ru":{"n":"Озеро Джандари","d":"Озеро Джандари расположено в Гардабанском муниципалитете, на границе Грузии и Азербайджана. Это тёплое озеро богато карпом, сомом, толстолобиком и белым амуром. Высокий шанс поймать крупный экземпляр — популярное место для трофейной рыбалки."}},"aragvi":{"en":{"d":"The Aragvi is a fast mountain river — a classic trout-fishing destination near Tbilisi. The upper reaches of the White and Black Aragvi hold brown trout; further downstream, khramulya, barbel and chub are found. Check licensed stretches in advance."},"ru":{"n":"Река Арагви","d":"Арагви — быстрая горная река, классическое направление для ловли форели рядом с Тбилиси. В верховьях Белой и Чёрной Арагви водится ручьевая форель, ниже по течению — храмуля, усач и голавль. Заранее уточняйте лицензируемые участки."}},"rioni":{"en":{"d":"The Rioni is western Georgia's largest river, running from the mountains of Racha to the Black Sea. Its upper reaches hold trout; the middle and lower reaches have catfish, barbel, chub and roach. In spring, species that favor brackish water come in from the Black Sea."},"ru":{"n":"Река Риони","d":"Риони — крупнейшая река западной Грузии, от гор Рачи до Чёрного моря. В верховьях водится форель, в среднем и нижнем течении — сом, усач, голавль и плотва. Весной из Чёрного моря заходят солоноватоводные виды."}},"sioni":{"en":{"d":"The Sioni Reservoir is built on the Iori River, in Tianeti municipality. Deep, cool water — the domain of zander, pike and bream. The shores are surrounded by forest; boat fishing is especially productive."},"ru":{"n":"Сионское водохранилище","d":"Сионское водохранилище построено на реке Иори, в Тианетском муниципалитете. Глубокая, прохладная вода — царство судака, щуки и леща. Берега окружены лесом, ловля с лодки особенно результативна."}},"paravani":{"en":{"d":"Paravani is Georgia's largest lake by area (37.5 km²). It lies on the Javakheti Plateau at 2073 m. Cold, clean water is home to khramulya, barbel and whitefish. It is Georgia's main spot for ice fishing in winter."},"ru":{"n":"Озеро Паравани","d":"Паравани — крупнейшее озеро Грузии по площади (37,5 км²). Расположено на Джавахетском плато на высоте 2073 м. Холодная, чистая вода — здесь обитают храмуля, усач и сиг. Главное место Грузии для зимней подлёдной рыбалки."}},"black_sea":{"en":{"d":"Georgia's Black Sea coastline is about 310 km long — from Anaklia to Sarpi. Shore fishing is most active in autumn and winter, when fish come closer to the coast. Much of the shoreline is pebbled, while Batumi and Kobuleti have concrete breakwaters — exactly where fish gather. Near the mouths of rivers (Enguri, Rioni, Chorokhi), brackish and fresh water mix, and migratory fish stop there.\n\nWave action directly affects results at sea: in complete calm the water is clear and fish stay deep; a 0.2–0.8 m chop stirs up food near shore and creates the best conditions; above 1.5 m, going out on the shore already becomes dangerous. Wave height and period are shown separately in the forecast and are factored into the score."},"ru":{"n":"Чёрное море","d":"Протяжённость черноморского побережья Грузии — около 310 км, от Анаклии до Сарпи. Ловля с берега наиболее активна осенью и зимой, когда рыба подходит ближе к берегу. Большая часть побережья галечная, а в Батуми и Кобулети есть бетонные волноломы — именно там скапливается рыба. У устьев рек (Ингури, Риони, Чорохи) смешивается солоноватая и пресная вода, и там задерживается проходная рыба.\n\nНа результат в море напрямую влияет волнение: в полный штиль вода прозрачна и рыба остаётся на глубине; волна 0,2–0,8 м у берега перемешивает корм и создаёт лучшие условия; при волне выше 1,5 м выходить на берег уже опасно. Высота и период волны показаны в прогнозе отдельно и учитываются в оценке."}},"zhinvali":{"en":{"d":"The Zhinvali Reservoir is built on the Aragvi — a place famous for its turquoise water, at the start of the Georgian Military Road. Trout, khramulya, barbel and chub live here. Fishing is allowed in designated stretches; the water level changes seasonally."},"ru":{"n":"Жинвальское водохранилище","d":"Жинвальское водохранилище построено на реке Арагви — место, известное своей бирюзовой водой, у начала Военно-Грузинской дороги. Здесь обитают форель, храмуля, усач и голавль. Рыбалка разрешена на отведённых участках; уровень воды меняется по сезонам."}},"kumisi":{"en":{"d":"Kumisi Lake is just about 20 km from Tbilisi. Its water is slightly brackish, home to carp, crucian carp and silver carp. The shoreline is convenient for feeder fishing. Due to its proximity to the capital it gets crowded on weekends."},"ru":{"n":"Озеро Кумиси","d":"Озеро Кумиси находится всего в 20 км от Тбилиси. Вода слегка солоноватая, обитают карп, карась и толстолобик. Береговая линия удобна для фидерной ловли. Из-за близости к столице по выходным здесь многолюдно."}},"tkibuli":{"en":{"d":"The Tkibuli (Shukruti) Reservoir is located in the Tkibuli basin in Imereti. Warm water and a rich food base — carp, crucian carp, pike and wels catfish. Known among local anglers for cases of large carp being caught."},"ru":{"n":"Ткибульское водохранилище","d":"Ткибульское (Шукрутское) водохранилище расположено в Ткибульской котловине в Имеретии. Тёплая вода и богатая кормовая база — карп, карась, щука и сом. Известно среди местных рыболовов случаями поимки крупного карпа."}},"chorokhi":{"en":{"d":"The Chorokhi is Adjara's largest river, flowing from the mountains of Turkey to the Black Sea near Batumi. Fast, torrential water; home to chub, barbel, roach and species that come in from the sea. The lower reaches and the river mouth are a spot for trophy fishing."},"ru":{"n":"Река Чорохи","d":"Чорохи — крупнейшая река Аджарии, текущая из гор Турции к Чёрному морю у Батуми. Быстрая, бурная вода; обитают голавль, усач, плотва и виды, заходящие с моря. Нижнее течение и устье — место трофейной рыбалки."}},"paliastomi":{"en":{"d":"Paliastomi Lake lies on the Black Sea coast near Poti and is part of Kolkheti National Park. Its brackish water creates a unique ecosystem — home to mullet, pike, crucian carp and wels catfish. A park permit is required for fishing."},"ru":{"n":"Озеро Палиастоми","d":"Озеро Палиастоми находится на черноморском побережье у Поти и входит в состав Колхетского национального парка. Солоноватая вода создаёт уникальную экосистему — обитают кефаль, щука, карась и сом. Для рыбалки необходимо разрешение парка."}},"khrami":{"en":{"d":"The Khrami is Kvemo Kartli's main river, joining the Mtkvari near the Red Bridge. It is famous for khramulya (which gave the river its name), and also home to barbel, wels catfish and chub. The lower reaches are warm and rich — fish bite all year round."},"ru":{"n":"Река Храми","d":"Храми — главная река Квемо-Картли, впадающая в Мтквари в районе Красного моста. Известна храмулей (от которой и произошло название реки), также обитают усач, сом и голавль. Нижнее течение тёплое и богатое — клюёт круглый год."}},"tabatskuri":{"en":{"d":"Tabatskuri is a high-mountain lake (1991 m) on the border of Borjomi and Akhalkalaki municipalities. Trout, khramulya and barbel live in its crystal-clear water. Exceptionally beautiful nature — fishing and camping together."},"ru":{"n":"Озеро Табацкури","d":"Табацкури — высокогорное озеро (1991 м) на границе Боржомского и Ахалкалакского муниципалитетов. В кристально чистой воде обитают форель, храмуля и усач. Исключительно красивая природа — рыбалка и кемпинг вместе."}},"tsalka":{"en":{"d":"The Tsalka Reservoir is built on the Khrami River, on the Javakheti volcanic plateau, at about 1450 m. Cold, clean water — home to trout, khramulya, crucian carp and rudd. Characterized by an open, treeless landscape and strong winds. A spot for ice fishing in winter."},"ru":{"n":"Цалкское водохранилище","d":"Цалкское водохранилище построено на реке Храми, на Джавахетском вулканическом плато, на высоте около 1450 м. Холодная, чистая вода — обитают форель, храмуля, карась и красноперка. Характерен открытый, безлесный ландшафт и сильные ветра. Зимой здесь ловят подо льдом."}},"kus_tba":{"en":{"d":"Turtle Lake is located on the slope of Mtatsminda, above Vake Park. A small but beautiful lake. Fishing is limited — it is used mainly for sport and recreation. Crucian carp and small carp live here."},"ru":{"n":"Черепашье озеро","d":"Черепашье озеро расположено на склоне Мтацминды, над парком Ваке. Небольшое, но красивое озеро. Рыбалка ограничена — используется в основном для спорта и отдыха. Обитают карась и мелкий карп."}},"gumati":{"en":{"d":"The Gumati Reservoir is built on the Rioni River, near Kutaisi. Warm, rich water — carp, wels catfish, roach and silver carp. Its accessible location and convenient shores make it a popular spot for Imereti's anglers."},"ru":{"n":"Гуматское водохранилище","d":"Гуматское водохранилище построено на реке Риони, рядом с Кутаиси. Тёплая, богатая вода — карп, сом, плотва и толстолобик. Доступное расположение и удобные берега делают его популярным местом для рыболовов Имеретии."}},"kvirila":{"en":{"d":"The Kvirila is the Rioni's main tributary in Imereti, passing through Chiatura and Zestafoni. The lower reaches are warm and rich — roach, barbel, catfish and khramulya. A popular, accessible river among local anglers."},"ru":{"n":"Река Квирила","d":"Квирила — главный приток Риони в Имеретии, протекающий через Чиатуру и Зестафони. Нижнее течение тёплое и богатое — плотва, усач, сом и храмуля. Популярная, доступная река среди местных рыболовов."}},"tergi":{"en":{"d":"The Tergi (Terek) originates from the glaciers of Kazbegi and flows north — cold, torrential, turquoise water. The domain of brown trout, in high-mountain, dramatic landscapes. A very well-known spot for mountain-fishing enthusiasts."},"ru":{"n":"Река Терги (Терек)","d":"Терги (Терек) берёт начало из ледников Казбеги и течёт на север — холодная, бурная, бирюзовая вода. Царство ручьевой форели среди высокогорных, драматичных пейзажей. Очень известное место для любителей горной рыбалки."}},"acharistskali":{"en":{"d":"The Acharistskali is the Chorokhi's main tributary — a clean, cold mountain river in the Keda and Shuakhevi gorges. The upper reaches are a classic trout spot; further down, roach and barbel are found. Characterized by stunning nature and rich flora."},"ru":{"n":"Река Аджарисцкали","d":"Аджарисцкали — главный приток Чорохи, чистая, холодная горная река в ущельях Кеда и Шуахеви. Верховья — классическое место для форели, ниже — плотва и усач. Отличается потрясающей природой и богатой флорой."}},"bateti":{"en":{"d":"Bateti Lake lies hidden in forested mountains of Kareli municipality, at about 1250 m. A small but especially beautiful lake — a favorite spot for rest and fishing. Crucian carp, roach and carp live here. A calm, family-friendly setting."},"ru":{"n":"Озеро Батети","d":"Озеро Батети скрыто в лесистых горах Карельского муниципалитета, на высоте около 1250 м. Небольшое, но особенно красивое озеро — любимое место отдыха и рыбалки. Обитают карась, плотва и карп. Спокойная, семейная обстановка."}},"enguri":{"en":{"d":"The Enguri originates from the glaciers of Svaneti — cold, turquoise water. The upper reaches are a classic trout spot, while the lower reaches hold barbel and chub. The gorge's stunning scenery adds a special atmosphere to fishing."},"ru":{"n":"Река Ингури","d":"Ингури берёт начало из ледников Сванетии — холодная, бирюзовая вода. Верховья — классическое место для форели, в нижнем течении обитают усач и голавль. Потрясающие пейзажи ущелья придают рыбалке особую атмосферу."}},"algeti":{"en":{"d":"The Algeti Reservoir is built on the Algeti River, in Tetritsqaro municipality, for irrigation. An accessible distance from Tbilisi. Home to carp, crucian carp, pike and roach. A calm, natural setting — with convenient shores for feeder fishing."},"ru":{"n":"Алгетское водохранилище","d":"Алгетское водохранилище построено на реке Алгети, в Тетрицкаройском муниципалитете, для орошения. Доступное расстояние от Тбилиси. Обитают карп, карась, щука и плотва. Спокойная, природная обстановка — с удобными берегами для фидерной ловли."}},"ksani":{"en":{"d":"The Ksani is Shida Kartli's main river — from the mountains down to the Mtkvari. Its upper reaches hold brown trout; the middle and lower reaches have khramulya, barbel, roach and chub. Varied stretches offer different fishing styles."},"ru":{"n":"Река Ксани","d":"Ксани — главная река Шида-Картли, от гор до Мтквари. В верховьях — ручьевая форель, в среднем и нижнем течении — храмуля, усач, плотва и голавль. Разнообразные участки позволяют разные стили ловли."}},"tekhuri":{"en":{"d":"The Tekhuri is a mountain river of Samegrelo, known for the Martvili Canyons and its emerald water. The upper reaches hold trout; further down, roach and barbel are found. The stunning canyons add a special atmosphere to fishing."},"ru":{"n":"Река Техури","d":"Техури — горная река Самегрело, известная Мартвильскими каньонами и изумрудной водой. В верховьях — форель, ниже обитают плотва и усач. Потрясающие каньоны придают рыбалке особую атмосферу."}},"tskhenistskali":{"en":{"d":"The Tskhenistskali is a fast, cold mountain river of Racha-Lechkhumi, flowing through forested gorges toward the Rioni. The upper reaches are an excellent trout spot; further down, barbel and roach are found. Wild, untouched nature."},"ru":{"n":"Река Цхенисцкали","d":"Цхенисцкали — быстрая, холодная горная река Рача-Лечхуми, протекающая через лесистые ущелья к Риони. Верховья — отличное место для форели, ниже обитают усач и плотва. Дикая, нетронутая природа."}},"iori":{"en":{"d":"The Iori flows through southern Kakheti — a calm river hidden in semi-desert landscapes. Khramulya, barbel, chub and crucian carp live here. A less crowded spot — for anglers who love quiet."},"ru":{"n":"Река Иори","d":"Иори протекает через южную Кахетию — спокойная река, скрытая в полупустынных ландшафтах. Обитают храмуля, усач, голавль и карась. Малолюдное место — для рыболовов, любящих тишину."}},"lajanuri":{"en":{"d":"The Lajanuri Reservoir is built on the Lajanuri River, in Lechkhumi, surrounded by steep, forested slopes. Turquoise water and beautiful nature. Home to trout, pike, crucian carp and roach. Boat fishing is especially productive in the deep coves."},"ru":{"n":"Лаянурское водохранилище","d":"Лаянурское водохранилище построено на реке Лаянура, в Лечхуми, окружённое крутыми, лесистыми склонами. Бирюзовая вода и прекрасная природа. Обитают форель, щука, карась и плотва. Ловля с лодки особенно результативна в глубоких заливах."}},"lilo":{"en":{"d":"A popular pay fishing lake on the outskirts of Tbilisi — carp, grass carp, silver carp. Comfortable spots for shore fishing."},"ru":{"n":"Озеро Лило","d":"Популярное платное озеро для рыбалки на окраине Тбилиси — карп, белый амур, толстолобик. Комфортные места для ловли с берега."}},"saghamo":{"en":{"d":"Saghamo Lake lies on the Javakheti Plateau, at 1996 m. A cold, clean high-mountain lake, surrounded by alpine meadows. Home to khramulya, barbel and crucian carp. Also a favorite spot for birdwatchers — fishing in calm, untouched nature."},"ru":{"n":"Озеро Сагамо","d":"Озеро Сагамо расположено на Джавахетском плато, на высоте 1996 м. Холодное, чистое высокогорное озеро, окружённое альпийскими лугами. Обитают храмуля, усач и карась. Также любимое место орнитологов — рыбалка в спокойной, нетронутой природе."}},"supsa":{"en":{"d":"The Supsa is a river of Guria — from the mountains to the Black Sea. The upper reaches hold trout; the lower reaches and the river mouth have roach, barbel and species coming in from the sea. A subtropical, green setting."},"ru":{"n":"Река Супса","d":"Супса — река Гурии, от гор до Чёрного моря. В верховьях — форель, в нижнем течении и устье — плотва, усач и виды, заходящие с моря. Субтропическая, зелёная обстановка."}},"babnisistbebi":{"en":{},"ru":{"n":"Озёра Бебниси"}},"chakviscxali":{"en":{},"ru":{"n":"Река Чаквисцкали"}},"cheliagelistba":{"en":{},"ru":{"n":"Озеро Челиагели"}},"chkhoushia":{"en":{"d":"The Chkhoushi is a river in western Georgia, in the Zugdidi and Tsalenjikha municipalities of the Samegrelo-Zemo Svaneti region. It is a right tributary of the Jumi River. Its total length is 41 km, 37.5 km of which lies within Zugdidi municipality. The Chkhoushi is formed by the Didi (Big) Chkhoushi and Patara (Small) Chkhoushi rivers."},"ru":{"n":"Река Чхоуши","d":"Чхоуши — река в западной Грузии, в Зугдидском и Цаленджихском муниципалитетах края Самегрело-Земо-Сванети. Правый приток реки Джуми. Общая длина реки — 41 км, из них 37,5 км приходится на территорию Зугдидского муниципалитета. Чхоуши образуется слиянием рек Диди-Чхоуши (Большая Чхоуши) и Патара-Чхоуши (Малая Чхоуши)."}},"ckalcitela_gelattan":{"en":{"d":"The Tskaltsitela is a major river of the Imereti region. It flows through a scenic, deep gorge near Kutaisi. The river and its gorge are historically significant — Gelati Monastery and Motsameta Monastery stand nearby. The gorge is also a popular spot for hiking and nature study."},"ru":{"n":"Река Цкалцители (у Гелати)","d":"Цкалцители — крупная река региона Имеретия. Протекает через живописное, глубокое ущелье рядом с Кутаиси. Река и её ущелье имеют историческое значение — поблизости находятся монастыри Гелати и Моцамета. Ущелье также популярно для походов и изучения природы."}},"digomi_floodplain_lakes":{"en":{"d":"Small lakes scattered in the Mtkvari floodplain near Dighomi — at 417 m above sea level, within Tbilisi's administrative boundaries. Each is small and shallow; the largest is about 0.3 hectares.\n\nThe main advantage is location — just a few minutes from the capital, suitable for a quick outing. The water is still, so it warms up quickly in summer, making morning hours more productive."},"ru":{"n":"Дигомские пойменные озёра","d":"Небольшие озёра, разбросанные в пойме Мтквари возле Дигоми — на высоте 417 м над уровнем моря, в административных границах Тбилиси. Каждое из них маленькое и неглубокое; самое крупное — около 0,3 гектара.\n\nГлавное преимущество — расположение: всего в нескольких минутах от столицы, подходит для короткой вылазки. Вода стоячая, поэтому летом быстро прогревается, и утренние часы более результативны."}},"dzirageulilake":{"en":{},"ru":{"n":"Озеро Дзирагеули"}},"iakublosreservior":{"en":{"d":"The Iakublo Reservoir is an artificial reservoir in Georgia. It is located in the Kvemo Kartli region, in Dmanisi municipality, within the administrative boundaries of the village of Iakublo, west of the settlement and east of the village of Shakhmarlo. Its water volume is 11.0 million m³, with a surface area of 2.0 km². The site where the reservoir now stands is referred to as Chairi on topographic maps.\n\nIt was put into operation in 1978. The reservoir supplies irrigation water to 3,000 hectares of land, and together with the Mtisdziri and Pantiani reservoirs provides water for a total of 8,000 hectares across Bolnisi, Dmanisi and Marneuli municipalities."},"ru":{"n":"Якублойское водохранилище","d":"Якублойское водохранилище — искусственный водоём в Грузии. Расположено в крае Квемо-Картли, в Дманисском муниципалитете, в административных границах села Якубло, к западу от населённого пункта и к востоку от села Шахмарло. Объём воды — 11,0 млн м³, площадь водной поверхности — 2,0 км². Место, где сейчас находится водохранилище, на топографических картах обозначено как Чаири.\n\nВведено в эксплуатацию в 1978 году. Водохранилище обеспечивает оросительной водой 3000 гектаров земли, а вместе с Мтисдзирским и Пантианским водохранилищами обслуживает водоснабжение в общей сложности 8000 гектаров земель Болнисского, Дманисского и Марнеульского муниципалитетов."}},"ilia_lake":{"en":{"d":"An artificial lake in Kvareli, set against the backdrop of the Caucasus — a resort area, fishing allowed in marked spots."},"ru":{"n":"Озеро Илиа","d":"Искусственное озеро в Кварели, на фоне Кавказского хребта — курортная зона, рыбалка разрешена в отмеченных местах."}},"karajalalake":{"en":{},"ru":{"n":"Озёра Караджала"}},"kodicxarostba":{"en":{"d":"A small lake in Khashuri municipality, Shida Kartli, on the Trialeti Ridge, about ten kilometers from the town.\n10 km from Khashuri, on the Trialeti Ridge;\nAltitude about 975 m;\nDirt road, passable in dry weather"},"ru":{"n":"Озеро Кодисцкаро","d":"Небольшое озеро в Хашурском муниципалитете, Шида-Картли, на Триалетском хребте, примерно в десяти километрах от города.\n10 км от Хашури, на Триалетском хребте;\nВысота около 975 м;\nГрунтовая дорога, проезжая в сухую погоду"}},"kutuzovistba":{"en":{},"ru":{"n":"Озеро Кутузови"}},"maganariver":{"en":{},"ru":{"n":"Река Магана"}},"mdinareabasha":{"en":{},"ru":{"n":"Река Абаша (у Бандза)"}},"mtkvari_rustavis_xidtan":{"en":{},"ru":{"n":"Река Мтквари (у Руставского моста)"}},"munchia":{"en":{"d":"The Munchia is a river in Samegrelo, within the Kolkheti lowland. A slow-flowing, lowland river; fishing is done from shore, free of charge and without a license."},"ru":{"n":"Река Мунчия","d":"Мунчия — река в Самегрело, в пределах Колхидской низменности. Медленная равнинная река; рыбалка ведётся с берега, бесплатно и без лицензии."}},"nadarbazevi":{"en":{"d":"Nadarbazevi Lake (reservoir) is located in Gori municipality, on the northern slope of the Kvernaki Ridge, at 856 m above sea level — half an hour's drive from Gori and Kaspi. The reservoir was formed at the site of an old lake and is fed from the Tirifoni canal. Area: 1.18 km², depth up to 1.8 m — warm, surface water that warms quickly in spring. Shore fishing is possible around nearly the whole perimeter."},"ru":{"n":"Озеро Надарбазеви","d":"Озеро (водохранилище) Надарбазеви расположено в Горийском муниципалитете, на северном склоне Кверанкского хребта, на высоте 856 м над уровнем моря — в получасе езды от Гори и Каспи. Водохранилище образовалось на месте старого озера и наполняется из Тирифонского канала. Площадь — 1,18 км², глубина до 1,8 м — тёплая, поверхностная вода, которая быстро прогревается весной. Рыбалка с берега возможна почти по всему периметру."}},"oqrostba":{"en":{},"ru":{"n":"Золотое озеро"}},"pantianistba":{"en":{"d":"Pantiani Lake (Pantiani Reservoir) is an artificial reservoir in Dmanisi municipality, near the village of Pantiani, 5 km from Dmanisi, at 1368 m above sea level. The lake is surrounded by coniferous forest. Tourist facilities have developed around the lake. Distance to the tourist site (from the municipal center) — 6 km. Mirror carp, crucian carp, grass carp and trout live in the lake."},"ru":{"n":"Озеро Пантиани","d":"Озеро Пантиани (Пантианское водохранилище) — искусственный водоём в Дманисском муниципалитете, рядом с селом Пантиани, в 5 км от Дманиси, на высоте 1368 м над уровнем моря. Озеро окружено хвойным лесом. Вокруг озера развита туристическая инфраструктура. Расстояние до туристического объекта (от муниципального центра) — 6 км. В озере обитают зеркальный карп, карась, белый амур и форель."}},"santrediistba":{"en":{},"ru":{"n":"Озеро в Самтредиа (ул. Конституции)"}},"sulori":{"en":{},"ru":{"n":"Река Сулори"}},"usakhelo":{"en":{"d":"Usakhelo Lake is located in Imereti, in Chiatura municipality — about 1.5 km from the village of Tskalshavi, at 770 m above sea level. The straight-line distance to Chiatura is 12 km, to Sachkhere — 15 km. A small lake, about 1.8 hectares. Fishing is done from shore — free of charge, without a license, and at any time of day or night. Boat fishing is not available."},"ru":{"n":"Озеро Усахело","d":"Озеро Усахело расположено в Имеретии, в Чиатурском муниципалитете — примерно в 1,5 км от села Цкалшави, на высоте 770 м над уровнем моря. Расстояние по прямой до Чиатуры — 12 км, до Сачхере — 15 км. Небольшое озеро, около 1,8 гектара. Рыбалка ведётся с берега — бесплатно, без лицензии и в любое время суток. Ловля с лодки не организована."}},"varvixistbebi":{"en":{},"ru":{"n":"Варцихские озёра"}},"zinobiani":{"en":{"d":"Zinobiani Lake is located in Kakheti, in Kvareli municipality — about 1 km north of the village of Zinobiani, at 333 m above sea level. The straight-line distance to Kvareli is 11 km, to Gurjaani — 21 km. Area about 20 hectares. Fishing is done from shore — free of charge, without a license, and at any time of day or night. Boat fishing is not available."},"ru":{"n":"Озеро Зинобиани","d":"Озеро Зинобиани расположено в Кахетии, в Кварельском муниципалитете — примерно в 1 км к северу от села Зинобиани, на высоте 333 м над уровнем моря. Расстояние по прямой до Кварели — 11 км, до Гурджаани — 21 км. Площадь около 20 гектаров. Рыбалка ведётся с берега — бесплатно, без лицензии и в любое время суток. Ловля с лодки не организована."}},"kartsakhi":{"en":{"d":"Kartsakhi Lake lies on the Javakheti Plateau, on the Georgia–Turkey border, at 1799 m. A shallow, cold lake — home to khramulya, crucian carp and barbel. Also an important spot for migratory birds."},"ru":{"n":"Озеро Карцахи","d":"Озеро Карцахи расположено на Джавахетском плато, на границе Грузии и Турции, на высоте 1799 м. Неглубокое, холодное озеро — обитают храмуля, карась и усач. Также важное место для перелётных птиц."}},"khanchali":{"en":{"d":"Khanchali Lake is part of the protected areas of Javakheti — a shallow lake with a rich ecosystem, one of the most important refuges for migratory birds. Home to khramulya and crucian carp. When fishing, be mindful of the protected area's regulations."},"ru":{"n":"Озеро Ханчали","d":"Озеро Ханчали входит в состав охраняемых территорий Джавахети — неглубокое озеро с богатой экосистемой, одно из важнейших убежищ перелётных птиц. Обитают храмуля и карась. При рыбалке учитывайте режим охраняемой территории."}},"bughdasheni":{"en":{"d":"Bughdasheni Lake is part of the protected areas of Javakheti — a small, shallow, bird-rich high-mountain lake. Home to khramulya and crucian carp. For lovers of untouched, peaceful nature."},"ru":{"n":"Озеро Бугдашени","d":"Озеро Бугдашени входит в состав охраняемых территорий Джавахети — небольшое, неглубокое, богатое птицами высокогорное озеро. Обитают храмуля и карась. Для любителей нетронутой, спокойной природы."}},"jvari_res":{"en":{"d":"The reservoir of the Enguri HPP dam near Jvari — a deep mountain reservoir, home to trout and khramulya."},"ru":{"n":"Джварское водохранилище","d":"Водохранилище плотины Ингурской ГЭС у Джвари — глубокое горное водохранилище, обитают форель и храмуля."}},"madatapa":{"en":{"d":"Madatapa Lake lies in southern Javakheti, near the border with Armenia, at 2108 m. A high-mountain, cold lake with protected status — rare bird species nest here. Home to khramulya and crucian carp. For lovers of wild, untouched nature."},"ru":{"n":"Озеро Мадатапа","d":"Озеро Мадатапа расположено в южном Джавахети, у границы с Арменией, на высоте 2108 м. Высокогорное, холодное озеро со статусом охраняемой территории — здесь гнездятся редкие виды птиц. Обитают храмуля и карась. Для любителей дикой, нетронутой природы."}},"lopota":{"en":{"d":"A lake in the Lopota Valley — resort territory, sport fishing (catch and release)."},"ru":{"n":"Озеро Лопота","d":"Озеро в долине Лопота — курортная территория, спортивная рыбалка (поймал-отпустил)."}},"bareti":{"en":{"d":"Bareti Lake is located in Tsalka municipality, on the eastern edge of the Javakheti Plateau — at 1619 m above sea level. Area about 1.4 km².\n\nA high-mountain, open place: there are almost no trees near the shore, and the wind picks up during the day — think about windbreak in advance. The season runs from late spring to autumn; in winter the lake freezes and the access road is covered in snow."},"ru":{"n":"Озеро Барети","d":"Озеро Барети расположено в Цалкском муниципалитете, на восточном краю Джавахетского плато — на высоте 1619 м над уровнем моря. Площадь около 1,4 км².\n\nВысокогорное, открытое место: у берега почти нет деревьев, и ветер усиливается в течение дня — заранее подумайте о защите от ветра. Сезон — с поздней весны до осени; зимой озеро замерзает, а подъездная дорога заносится снегом."}},"chanistskali":{"en":{"d":"A river in Samegrelo, in Tsalenjikha municipality — a tributary of the Enguri. Coordinates are from OpenStreetMap (Tsalenjikha stretch)."},"ru":{"n":"Река Чанисцкали","d":"Река в Самегрело, в Цаленджихском муниципалитете — приток Ингури. Координаты взяты из OpenStreetMap (Цаленджихский участок)."}},"chkhoushi":{"en":{"d":"A river in Samegrelo, in Zugdidi municipality. Coordinates are from OpenStreetMap (Ingiri stretch)."},"ru":{"n":"Река Чхоуши","d":"Река в Самегрело, в Зугдидском муниципалитете. Координаты взяты из OpenStreetMap (Ингирский участок)."}},"chorokhi_shesartavtan":{"en":{},"ru":{"n":"Река Чорохи (у устья)"}},"churia":{"en":{"d":"The Churia is a river of the Kolkheti lowland in Zugdidi municipality, near Anaklia, and part of Kolkheti National Park. Slow current, marshy banks and dense Colchic vegetation — the area is on the UNESCO World Heritage list (\"Colchic Rainforests and Wetlands\"). Sport fishing is allowed on the park's tourist route and requires administration permission. Kayak and pontoon routes also operate on the river."},"ru":{"n":"Река Чурия","d":"Чурия — река Колхидской низменности в Зугдидском муниципалитете, рядом с Анаклией, часть Колхетского национального парка. Медленное течение, заболоченные берега и густая колхидская растительность — территория включена в список Всемирного наследия ЮНЕСКО («Колхидские дождевые леса и водно-болотные угодья»). Спортивная рыбалка разрешена на туристическом маршруте парка и требует разрешения администрации. На реке также действуют каяк- и понтонные маршруты."}},"dali":{"en":{"d":"The Dali Reservoir is located in Dedoplistsqaro municipality, on the Iori Plateau — at 284 m above sea level. An artificial irrigation reservoir in the southern, steppe belt of Kakheti.\n\nThe surroundings are open steppe: there is almost no shade or trees, so in summer morning and evening hours are better — midday heat is harsh. The shore is low and accessible, convenient for shore fishing. The nearest settlement is Dedoplistsqaro."},"ru":{"n":"Дальское водохранилище","d":"Дальское водохранилище расположено в Дедоплисцкаройском муниципалитете, на Иорском плато — на высоте 284 м над уровнем моря. Искусственный оросительный водоём в южном, степном поясе Кахетии.\n\nВокруг — открытая степь: тени и деревьев почти нет, поэтому летом лучше утренние и вечерние часы — в полдень жара тяжёлая. Берег низкий и доступный, удобен для ловли с берега. Ближайший населённый пункт — Дедоплисцкаро."}},"ghurghumelas":{"en":{"d":"Ghurghumela Lake is located in Imereti. A small lake where fishing is done from shore — free of charge and without a license. Boat fishing is not available."},"ru":{"n":"Озеро Гургумела","d":"Озеро Гургумела расположено в Имеретии. Небольшое озеро, рыбалка ведётся с берега — бесплатно и без лицензии. Ловля с лодки не организована."}},"gldani_lake":{"en":{"d":"A small lake in the Gldani district — a frequent spot for local anglers. Crucian carp and carp."},"ru":{"n":"Малое Глданское озеро","d":"Небольшое озеро в районе Глдани — частое место местных рыболовов. Карась и карп."}},"gldanis_didi":{"en":{"d":"Gldani Big Lake is located in the northern part of Tbilisi, near the Gldani district. A city lake — the shores are easily accessible and reachable by public transport. Fishing is done from shore, free of charge and without a license."},"ru":{"n":"Большое Глданское озеро","d":"Большое Глданское озеро расположено в северной части Тбилиси, рядом с районом Глдани. Городское озеро — берега легкодоступны и добраться можно на общественном транспорте. Рыбалка ведётся с берега, бесплатно и без лицензии."}},"jandaras_rustavtan":{"en":{},"ru":{"n":"Мариинский канал"}},"jikurebi":{"en":{"d":"Jikurebi Lake is in the eastern part of Sagarejo municipality, at 756 m above sea level. Area about 83 hectares. Nearby there is another body of water — Sakhare Lake, so both can be visited in one outing.\n\nIt lies in Kakheti's steppe belt: there is almost no natural shade, and summer midday is harsh — morning and evening hours are better. The shore is low and accessible."},"ru":{"n":"Озеро Джикуреби","d":"Озеро Джикуреби находится в восточной части Сагареджойского муниципалитета, на высоте 756 м над уровнем моря. Площадь около 83 гектаров. Поблизости есть ещё один водоём — озеро Сахаре, так что за одну поездку можно посетить оба.\n\nНаходится в степном поясе Кахетии: естественной тени почти нет, и летний полдень тяжёлый — утренние и вечерние часы предпочтительнее. Берег низкий и доступный."}},"jumi":{"en":{"d":"A river in Samegrelo, in Zugdidi municipality. Coordinates are from OpenStreetMap (Tsaishi stretch)."},"ru":{"n":"Река Джуми","d":"Река в Самегрело, в Зугдидском муниципалитете. Координаты взяты из OpenStreetMap (Цаишский участок)."}},"kharkalus_nachuru":{"en":{"d":"Kharkalu (Nachuru) Lake is located on the Kolkheti lowland, in Zugdidi municipality — about a kilometer from the Churia River. A slow, marsh-type lowland lake; fishing is done from shore. Access is by dirt road, with no infrastructure."},"ru":{"n":"Озеро Харкалу (Начуру)","d":"Озеро Харкалу (Начуру) расположено на Колхидской низменности, в Зугдидском муниципалитете — примерно в километре от реки Чурия. Медленное озеро болотного типа на низменности; рыбалка ведётся с берега. Подъезд по грунтовой дороге, инфраструктуры нет."}},"lipi":{"en":{"d":"Lipi Lake is near the village of Lipi, in Tetritsqaro municipality — at 1083 m above sea level.\n\nOn the map it is marked as a marshy body of water: it is shallow and the shore is bordered by reeds. In such a place the water warms quickly in spring, while in midsummer oxygen levels drop — so spring and autumn are more productive."},"ru":{"n":"Озеро Липи","d":"Озеро Липи находится рядом с селом Липи, в Тетрицкаройском муниципалитете — на высоте 1083 м над уровнем моря.\n\nНа карте отмечено как заболоченный водоём: неглубокое, берег окаймлён камышом. В таком месте вода весной быстро прогревается, а в разгар лета уровень кислорода снижается — поэтому весна и осень более результативны."}},"triala":{"en":{"d":"A high-mountain lake in Adigeni municipality, near the village of Ijareti — at 1619 m above sea level. Area about 12 hectares.\n\nThere are a few more small lakes nearby, including Black Lake, so several can be visited in one outing. Because of the altitude the season is short — from late spring to autumn; in winter the access road is closed by snow. Mountain weather changes quickly, so check the forecast on the day of your trip."},"ru":{"n":"Озеро Триала","d":"Высокогорное озеро в Адигенском муниципалитете, рядом с селом Иджарети — на высоте 1619 м над уровнем моря. Площадь около 12 гектаров.\n\nПоблизости есть ещё несколько небольших озёр, включая Чёрное озеро, так что за одну поездку можно посетить несколько. Из-за высоты сезон короткий — с поздней весны до осени; зимой подъездная дорога закрыта снегом. Погода в горах меняется быстро, поэтому проверяйте прогноз в день поездки."}},"zemo_kukhi":{"en":{"d":"The Zemo Kukhi Reservoir is located in Khoni municipality, on the Imereti lowland — at 170 m above sea level. Also known as the Khoni Reservoir. Area about 28 hectares.\n\nIts low elevation and Imereti's mild climate extend the season — it is accessible most of the year. The shore is relatively open and convenient for shore fishing. As is typical for western Georgia, the water turns murky after heavy rain."},"ru":{"n":"Водохранилище Земо-Кухи","d":"Водохранилище Земо-Кухи расположено в Хонском муниципалитете, на Имеретинской низменности — на высоте 170 м над уровнем моря. Также известно как Хонское водохранилище. Площадь около 28 гектаров.\n\nНизкая высота и мягкий климат Имеретии продлевают сезон — доступно большую часть года. Берег относительно открытый и удобен для ловли с берега. Как типично для западной Грузии, после сильного дождя вода мутнеет."}},"ziari":{"en":{"d":"A small lake in Kakheti, in Gurjaani municipality, near the village of Kodalo. The best spot for spending family time."},"ru":{"n":"Озеро Зиари","d":"Небольшое озеро в Кахетии, в Гурджаанском муниципалитете, рядом с селом Кодало. Лучшее место для семейного отдыха."}},"zreski":{"en":{"d":"Zreski Lake lies on the Javakheti Plateau, in Akhalkalaki municipality — at 1719 m above sea level. Also known as Lake Paskia. Area about 2 km².\n\nA setting typical of Javakheti's lakes: an open, treeless shore and strong wind that intensifies during the day — there is practically no windbreak. The season runs from late spring to autumn; in winter the lake freezes."},"ru":{"n":"Озеро Зрески","d":"Озеро Зрески расположено на Джавахетском плато, в Ахалкалакском муниципалитете — на высоте 1719 м над уровнем моря. Также известно как озеро Паскиа. Площадь около 2 км².\n\nОбстановка, типичная для озёр Джавахети: открытый, безлесный берег и сильный ветер, усиливающийся в течение дня — защиты от ветра практически нет. Сезон — с поздней весны до осени, зимой озеро замерзает."}},"liakhvi":{"en":{"d":"A left tributary of the Mtkvari near Gori — trout in the upper reaches, barbel and khramulya further down."},"ru":{"n":"Река Лиахви","d":"Левый приток Мтквари в районе Гори — форель в верховьях, усач и храмуля ниже по течению."}},"debeda":{"en":{"d":"A river flowing in from Armenia near Sadakhlo — barbel, Bulatmai barbel and wels catfish in the lower reaches."},"ru":{"n":"Река Дебеда","d":"Река, впадающая со стороны Армении в районе Садахло, — усач, чанари и сом в нижнем течении."}},"khobi_river":{"en":{"d":"A river of the Kolkheti lowland — mullet near the mouth, wels catfish and bream in the middle reaches."},"ru":{"n":"Река Хобисцкали","d":"Река Колхидской низменности — кефаль у устья, сом и лещ в среднем течении."}},"kintrishi":{"en":{"d":"A fast mountain river of the Kobuleti highlands, within the Kintrishi protected areas — brown trout."},"ru":{"n":"Река Кинтриши","d":"Быстрая горная река Кобулетского высокогорья, в пределах охраняемых территорий Кинтриши — ручьевая форель."}},"dzirula":{"en":{"d":"The Dzirula is the Kvirila's right tributary — a mountain river originating from the Racha Ridge and joining the Kvirila near Zestafoni, passing through Kharagauli municipality. The upper reaches are cold and fast — home to brown trout; in the lower reaches, below Kharagauli, barbel, chub and khramulya are found. The shores are mostly easily accessible, fishing requires a license."},"ru":{"n":"Река Дзирула","d":"Дзирула — правый приток Квирилы, горная река, берущая начало на Рачинском хребте и впадающая в Квирилу у Зестафони, протекая через Харагаульский муниципалитет. Верховья холодные и быстрые — обитает ручьевая форель; в нижнем течении, ниже Харагаули, встречаются усач, голавль и храмуля. Берега в основном легкодоступны, для рыбалки нужна лицензия."}},"natanebi":{"en":{"d":"A river of Guria near Ureki — mullet and grey mullet at the Black Sea mouth."},"ru":{"n":"Река Натанеби","d":"Река Гурии в районе Уреки — кефаль у устья в Чёрное море."}},"chkherimela":{"en":{"d":"A right tributary of the Kvirila — a fast mountain river in Kharagauli municipality, near Borjomi-Kharagauli National Park. The upper reaches hold brown trout; further down, khramulya and barbel."},"ru":{"n":"Река Чхеримела","d":"Правый приток Квирилы — быстрая горная река в Харагаульском муниципалитете, рядом с Боржоми-Харагаульским национальным парком. В верховьях — ручьевая форель, ниже — храмуля и усач."}},"gubistskali":{"en":{"d":"The Gubistskali is a right tributary of the Rioni — it is formed by the confluence of the Kumisi and Semi rivers near the village of Dedalauri, at 105 m above sea level, and flows across the Imereti lowland to Samtredia. Length 36 km, basin area 442 km², average annual flow 16.3 m³/s.\n\nFed by rain and groundwater: there are spring floods, while August–September bring low water — exactly when shore fishing is most convenient, the water is clear and the river's features are easy to read.\n\nIn the lower reaches, near the confluence with the Rioni, there are barbel and wels catfish; in the middle and upper stretches, chub and khramulya. In the Semi gorge, at 235 m above sea level, there is a natural limestone bridge from the Cretaceous period — a beautiful spot for daytime fishing."},"ru":{"n":"Река Губисцкали","d":"Губисцкали — правый приток Риони, образующийся слиянием рек Куми и Семи у села Дедалаури, на высоте 105 м над уровнем моря, и протекающий по Имеретинской низменности до Самтредиа. Длина 36 км, площадь бассейна 442 км², средний годовой расход 16,3 м³/с.\n\nПитается дождевой и подземной водой: весной — паводок, в августе–сентябре — межень, именно тогда ловля с берега наиболее удобна, вода прозрачна и участки легко читаются.\n\nВ нижнем течении, у слияния с Риони, — усач и сом; на среднем и верхнем участках — голавль и храмуля. В ущелье реки Семи, на высоте 235 м над уровнем моря, расположен природный известняковый мост мелового периода — живописное место для дневной рыбалки."}},"aleksandrouli":{"en":{"d":"A mountain river of Racha, a tributary of the Rioni — brown trout in the upper reaches."},"ru":{"n":"Река Рицеула","d":"Горная река Рачи, приток Риони — ручьевая форель в верховьях."}},"tsivi_tba":{"en":{"d":"A small lake near Marneuli — crucian carp and carp, a quiet fishing spot."},"ru":{"n":"Озеро Циви","d":"Небольшое озеро в районе Марнеули — карась и карп, тихое место для рыбалки."}},"amtkeli":{"en":{"d":"A lake in Gulripshi municipality, at 512 m above sea level. It formed during the earthquake of October 3, 1891, when a landslide blocked the valley of the Amtkeli River. The territory is occupied — access is not possible. This entry is informational: forecast and geographic data are available, but planning a fishing trip is not."},"ru":{"n":"Озеро Амткели","d":"Озеро в Гульрипшском муниципалитете, на высоте 512 м над уровнем моря. Образовалось во время землетрясения 3 октября 1891 года, когда оползень перекрыл долину реки Амткели. Территория оккупирована — доступ невозможен. Запись носит информационный характер: прогноз и географические данные доступны, а планирование рыбалки — нет."}},"bzipi":{"en":{"d":"A mountain river in Abkhazia, 110 km long. It originates in the Caucasus and flows into the Black Sea near Bichvinta (Pitsunda). The territory is occupied — access is not possible. This entry is informational: forecast and geographic data are available, but planning a fishing trip is not."},"ru":{"n":"Река Бзыбь","d":"Горная река в Абхазии, длиной 110 км. Берёт начало на Кавказском хребте и впадает в Чёрное море у Бичвинты (Пицунды). Территория оккупирована — доступ невозможен. Запись носит информационный характер: прогноз и географические данные доступны, а планирование рыбалки — нет."}},"ertso":{"en":{"d":"A karst lake in Java municipality, at 1710 m above sea level. Area 0.31 km², maximum depth 19 m, average depth 2.1 m. The territory is occupied — access is not possible. This entry is informational: forecast and geographic data are available, but planning a fishing trip is not."},"ru":{"n":"Озеро Эрцо","d":"Карстовое озеро в Джавском муниципалитете, на высоте 1710 м над уровнем моря. Площадь 0,31 км², максимальная глубина 19 м, средняя — 2,1 м. Территория оккупирована — доступ невозможен. Запись носит информационный характер: прогноз и географические данные доступны, а планирование рыбалки — нет."}},"kodori":{"en":{"d":"One of Abkhazia's largest rivers — 105 km long. It originates on the main ridge of the Caucasus, at 1380 m, and flows into the Black Sea near Ochamchire. The territory is occupied — access is not possible. This entry is informational: forecast and geographic data are available, but planning a fishing trip is not."},"ru":{"n":"Река Кодори","d":"Одна из крупнейших рек Абхазии — длиной 105 км. Берёт начало на главном хребте Кавказа, на высоте 1380 м, и впадает в Чёрное море у Очамчире. Территория оккупирована — доступ невозможен. Запись носит информационный характер: прогноз и географические данные доступны, а планирование рыбалки — нет."}},"ritsa":{"en":{"d":"A mountain lake in northwestern Abkhazia, in the Caucasus, at 950 m above sea level. It formed as a result of a landslide that blocked the valley of the Lashipse River. Maximum depth 116 m. The territory is occupied — access is not possible. This entry is informational: forecast and geographic data are available, but planning a fishing trip is not."},"ru":{"n":"Озеро Рица","d":"Горное озеро на северо-западе Абхазии, на Кавказском хребте, на высоте 950 м над уровнем моря. Образовалось в результате оползня, перекрывшего долину реки Лашипсе. Максимальная глубина — 116 м. Территория оккупирована — доступ невозможен. Запись носит информационный характер: прогноз и географические данные доступны, а планирование рыбалки — нет."}},"abudelauri":{"en":{"d":"Glacial lakes in Khevsureti, above the village of Roshka — White, Blue and Green."},"ru":{"n":"Абудэлаурские озёра","d":"Ледниковые озёра в Хевсуретии, над селом Рошка — Белое, Голубое и Зелёное."}},"chili_tba":{"en":{"d":"A lake in Mtskheta municipality, near Tbilisi."},"ru":{"n":"Озеро Чили","d":"Озеро в Мцхетском муниципалитете, рядом с Тбилиси."}},"cholevi":{"en":{"d":"A mountain lake in Oni municipality, Racha."},"ru":{"n":"Озеро Чолеви","d":"Горное озеро в Онском муниципалитете, Рача."}},"gokhnari":{"en":{"d":"A lake in Tetritsqaro municipality, Kvemo Kartli."},"ru":{"n":"Озеро Гохнари","d":"Озеро в Тетрицкаройском муниципалитете, Квемо-Картли."}},"grdzeli_tba":{"en":{"d":"Also known as Black Rocks Lake. Lagodekhi municipality."},"ru":{"n":"Озеро Грдзели","d":"Также известно как озеро Чёрных скал. Лагодехский муниципалитет."}},"kakhisi":{"en":{"d":"A mountain lake in Borjomi municipality."},"ru":{"n":"Озеро Кахиси","d":"Горное озеро в Боржомском муниципалитете."}},"kochebi":{"en":{"d":"A lake in Dedoplistsqaro municipality."},"ru":{"n":"Озеро Кочеби","d":"Озеро в Дедоплисцкаройском муниципалитете."}},"koruldi":{"en":{"d":"High-mountain lakes above Mestia, in Upper Svaneti."},"ru":{"n":"Корулдские озёра","d":"Высокогорные озёра над Местиа, в Верхней Сванетии."}},"mtsvane_tba":{"en":{"d":"A lake in Dedoplistsqaro municipality, in southern Kakheti."},"ru":{"n":"Зелёное озеро","d":"Озеро в Дедоплисцкаройском муниципалитете, в южной Кахетии."}},"narekvavi":{"en":{"d":"A reservoir in Dusheti municipality."},"ru":{"n":"Нареквавское водохранилище","d":"Водохранилище в Душетском муниципалитете."}},"nuri":{"en":{"d":"A city lake in Batumi — accessible for shore fishing."},"ru":{"n":"Озеро Нури","d":"Городское озеро в Батуми — доступно для ловли с берега."}},"surami_tba":{"en":{"d":"A lake in Surami, Khashuri municipality."},"ru":{"n":"Озеро Сурами","d":"Озеро в Сурами, Хашурский муниципалитет."}},"tobavarchkhili":{"en":{"d":"A high-mountain lake on the Egrisi Ridge, in Martvili municipality. Also known as Silver Lake."},"ru":{"n":"Озеро Тобаварчхили","d":"Высокогорное озеро на Эгрисском хребте, в Мартвильском муниципалитете. Также известно как Серебряное озеро."}},"tsero_tba":{"en":{"d":"A lake in Borjomi municipality."},"ru":{"n":"Озеро Церо","d":"Озеро в Боржомском муниципалитете."}}};
const FISH_I18N={"brown_meagre":{"en":{"n":"Brown Meagre","d":"The brown meagre (Rus. gorbyl) is a deep-bodied fish with a dark bronze-brown back; its ventral fins are almost black with a white leading edge. It lives over rocky bottoms, breakwaters and pier pilings at depths of 2-30 m, often in small groups. By day it hides among rocks, coming out at dusk and at night to feed on crabs, shrimp and small fish. It is caught from shore on bottom and float tackle — besides lugworm it readily takes shrimp, crab and mussel meat. In the Black Sea its lighter-colored relative, the shi drum (Umbrina cirrosa), is also found. Stocks have declined in many areas — please release small specimens.","m":"May – October (peak: summer nights)","h":"Dusk and night","w":"Calm, warm","p":"Stable","wd":"Light; bites weakly near rocks in strong swell","b":"Ragworm, Soft plastic lure","tk":"Bottom rig, Spinning rod (5-20 g)","avg":"25-40 cm","rec":"70 cm"},"ru":{"n":"Горбыль","d":"Горбыль — высокотелая рыба тёмного бронзово-коричневого цвета; брюшные плавники почти чёрные с белой передней кромкой. Обитает у каменистого дна, волноломов и свай причалов на глубине 2-30 м, часто небольшими группами. Днём прячется среди камней, выходит в сумерках и ночью, питается крабами, креветками и мелкой рыбой. Ловится с берега на донную и поплавочную снасть — помимо морского червя хорошо берёт креветку, краба и мясо мидии. В Чёрном море встречается и его более светлый родственник — светлый горбыль (Umbrina cirrosa). Запасы во многих местах сократились — отпускайте мелкие экземпляры.","m":"Май — октябрь (пик: летние ночи)","h":"Сумерки и ночь","w":"Тихая, тёплая","p":"Стабильное","wd":"Слабый; при сильном волнении у скал клюёт слабо","b":"Нереис, Силиконовая приманка","tk":"Донная снасть, Спиннинг (5-20 г)","avg":"25-40 см","rec":"70 см"}},"vimba":{"en":{"n":"Vimba Bream","d":"The vimba is a bottom-feeding fish with a distinctive pointed snout used to search for food on the riverbed. It lives in rivers with current, especially in the lower reaches of the Mtkvari and its tributaries. During spawning it darkens and changes color.","m":"April – October","h":"Evening and night hours","w":"Warm weather; becomes active in turbid water after rain","p":"Stable pressure","wd":"Light wind","b":"Red worm (dung/earthworm), Bloodworm, Bread crumb, Fermented corn (sweet)","tk":"Feeder, Bottom rig","avg":"200-600 g","rec":"2+ kg"},"ru":{"n":"Вимба (рыбец)","d":"Вимба — донная рыба с характерным заострённым рылом, которым она ищет корм на дне. Обитает в реках с течением, особенно в нижнем течении Куры и её притоков. В период нереста темнеет и меняет окраску.","m":"Апрель — октябрь","h":"Вечерние и ночные часы","w":"Тёплая погода; активизируется в мутной воде после дождя","p":"Стабильное давление","wd":"Слабый ветер","b":"Красный червь (навозный/земляной), Мотыль, Хлебный мякиш, Ферментированная кукуруза (сладкая)","tk":"Фидер, Донная снасть","avg":"200-600 г","rec":"2+ кг"}},"grass_carp":{"en":{"n":"Grass Carp","d":"The grass carp is a large fish that loves plant food, found in lakes and reservoirs. It is very wary — it swims away when approached near shore. It grows quickly and puts up serious resistance to the angler.","m":"May – September (water temp. 18°C+)","h":"Morning (06:00-10:00) and calm evenings","w":"Hot, sunny, windless days","p":"High stable pressure","wd":"Calm — sensitive to noise while feeding at the surface","b":"Fermented corn (sweet), Boilie","tk":"Carp rod, Heavy-duty feeder","avg":"2-6 kg","rec":"30+ kg"},"ru":{"n":"Белый амур","d":"Белый амур — крупная рыба, любящая растительную пищу, распространена в озёрах и водохранилищах. Очень осторожна — при приближении к берегу уплывает далеко. Быстро растёт и оказывает серьёзное сопротивление рыболову.","m":"Май — сентябрь (темп. воды 18°C+)","h":"Утро (06:00-10:00) и тихие вечера","w":"Жаркие, солнечные, безветренные дни","p":"Высокое стабильное давление","wd":"Штиль — чувствителен к шуму при кормёжке у поверхности","b":"Ферментированная кукуруза (сладкая), Бойлы","tk":"Карповое удилище, Мощный фидер","avg":"2-6 кг","rec":"30+ кг"}},"bleak":{"en":{"n":"Common Bleak","d":"The bleak is a small, silvery, fast fish that moves in large schools in the upper water layers. It is easily caught with light tackle — ideal for beginners and fishing with children. It is also often used as bait for predators.","m":"April – October","h":"All day, during warm hours","w":"Warm, sunny weather","p":"Any stable pressure","wd":"Calm or light breeze","b":"Bloodworm/maggot, Bread crumb, Red worm (dung/earthworm)","tk":"Light float rod","avg":"10-40 g","rec":"150 g"},"ru":{"n":"Уклейка","d":"Уклейка — мелкая, серебристая, быстрая рыба, перемещающаяся большими стаями в верхних слоях воды. Легко ловится на лёгкую снасть — идеальна для новичков и рыбалки с детьми. Часто используется и как насадка на хищника.","m":"Апрель — октябрь","h":"Весь день, в тёплые часы","w":"Тёплая, солнечная погода","p":"Любое стабильное давление","wd":"Штиль или лёгкий ветерок","b":"Опарыш, Хлебный мякиш, Красный червь (навозный/земляной)","tk":"Лёгкая поплавочная удочка","avg":"10-40 г","rec":"150 г"}},"turbot":{"en":{"n":"Black Sea Turbot","d":"A large, flat bottom-dwelling fish with both eyes on one side; it buries itself in sand and hunts by ambush. It is one of the Black Sea's most prized fish, though stocks have sharply declined — harvesting in Georgia is regulated (quota and closed season) and is mostly done from boats with nets. It is practically not caught from shore.","m":"April – June","h":"Daytime hours","w":"Calm","p":"Stable","wd":"Light","b":"","tk":"Bottom rig from a boat, Regulated species — check season and quota","avg":"1-3 kg","rec":"15 kg"},"ru":{"n":"Черноморский калкан","d":"Крупная плоская донная рыба с обоими глазами на одной стороне тела; зарывается в песок и охотится из засады. Один из самых ценных видов Чёрного моря, хотя его запасы резко сократились — добыча в Грузии регулируется (квота и период запрета) и ведётся в основном с лодок сетями. С берега практически не ловится.","m":"Апрель — июнь","h":"Дневные часы","w":"Тихая","p":"Стабильное","wd":"Слабый","b":"","tk":"Донная снасть с лодки, Регулируемый вид — проверяйте сезон и квоту","avg":"1-3 кг","rec":"15 кг"}},"bream":{"en":{"n":"Common Bream","d":"The bream is a schooling fish — if you catch one, the school is nearby. It lives on the deep, muddy bottom of lakes and rivers. It is the classic target of feeder fishing. It is wary and prefers calm weather.","m":"April – October (peak: May, September)","h":"Night and dawn (03:00-08:00), evening","w":"Warm, calm nights; becomes active after rain","p":"Stable pressure for 2-3 days","wd":"Calm or very light breeze","b":"Red worm (dung/earthworm), Bloodworm/maggot, Fermented corn (sweet), Semolina paste","tk":"Feeder, Long float rod","avg":"0.5-1.5 kg","rec":"5+ kg"},"ru":{"n":"Лещ","d":"Лещ — стайная рыба: если поймали одну, стая рядом. Обитает на глубоком, илистом дне озёр и рек. Классическая цель фидерной ловли. Осторожен и предпочитает тихую погоду.","m":"Апрель — октябрь (пик: май, сентябрь)","h":"Ночь и рассвет (03:00-08:00), вечер","w":"Тёплые, тихие ночи; активизируется после дождя","p":"Стабильное давление в течение 2-3 дней","wd":"Штиль или очень лёгкий ветерок","b":"Красный червь (навозный/земляной), Опарыш, Ферментированная кукуруза (сладкая), Манная болтушка","tk":"Фидер, Длинное маховое удилище","avg":"0.5-1.5 кг","rec":"5+ кг"}},"karagoz":{"en":{"n":"Common Two-banded Seabream","d":"The karagoz (Turkish karagöz — \"black-eye\") is a silvery, laterally flattened fish with two black bands — one behind the head, one at the base of the tail. It lives over rocky bottoms, breakwaters and piers at depths of 1-30 m, often in small schools. It is wary and bites sharply — a fine hook and thin leader are needed. It readily takes lugworm, shrimp and mussel meat. In the Black Sea its smaller relative, the annular seabream (Diplodus annularis), is also found.","m":"May – October","h":"Morning and daytime hours","w":"Calm, warm","p":"Stable","wd":"Light; bites weakly near rocks in strong swell","b":"Ragworm","tk":"Float rod, Light bottom rig","avg":"15-25 cm","rec":"45 cm"},"ru":{"n":"Сарг (карагёз)","d":"Карагёз (тур. karagöz — «чёрный глаз») — серебристая, уплощённая с боков рыба с двумя чёрными полосами — одна за головой, другая у основания хвоста. Обитает у каменистого дна, волноломов и причалов на глубине 1-30 м, часто небольшими стайками. Осторожна и резко клюёт — нужен тонкий крючок и лёгкий поводок. Хорошо берёт нереиса, креветку и мясо мидии. В Чёрном море встречается и её меньший родственник — ласкирь (Diplodus annularis).","m":"Май — октябрь","h":"Утро и дневные часы","w":"Тихая, тёплая","p":"Стабильное","wd":"Слабый; при сильном волнении у скал клюёт слабо","b":"Нереис","tk":"Поплавочная снасть, Лёгкая донная снасть","avg":"15-25 см","rec":"45 см"}},"crucian":{"en":{"n":"Prussian Carp","d":"The crucian (also known as Prussian carp) is the most widespread fish in Georgia's lakes and reservoirs. It is hardy and lives almost everywhere — even in ponds where no other fish survive. It is ideal for beginners: it bites actively throughout the whole warm season and doesn't require complicated tackle.","m":"March – November (peak: May–September)","h":"Morning (06:00-10:00) and evening (17:00-20:00)","w":"Warm, calm weather; feeds all day on cloudy days","p":"Stable pressure","wd":"Light wind or calm","b":"Red worm (dung/earthworm), Bread crumb, Fermented corn (sweet), Semolina paste, Bloodworm/maggot","tk":"Float rod, Light feeder","avg":"150-500 g","rec":"2+ kg"},"ru":{"n":"Карась серебряный","d":"Карась (также известный как серебряный карась) — самая распространённая рыба в озёрах и водохранилищах Грузии. Вынослив и живёт почти везде — даже в прудах, где другая рыба не выживает. Идеален для новичков: активно клюёт весь тёплый сезон и не требует сложной снасти.","m":"Март — ноябрь (пик: май–сентябрь)","h":"Утро (06:00-10:00) и вечер (17:00-20:00)","w":"Тёплая, тихая погода; в пасмурные дни кормится весь день","p":"Стабильное давление","wd":"Лёгкий ветер или штиль","b":"Красный червь (навозный/земляной), Хлебный мякиш, Ферментированная кукуруза (сладкая), Манная болтушка, Опарыш","tk":"Поплавочная снасть, Лёгкий фидер","avg":"150-500 г","rec":"2+ кг"}},"mullet":{"en":{"n":"Flathead Mullet","d":"The mullet is a silvery, torpedo-shaped fish that comes from the Black Sea into brackish waters — Lake Paliastomi and river mouths — to feed. It moves in schools and often jumps at the surface. Its flesh is tasty and fatty.","m":"June – November","h":"Morning and evening","w":"Warm, calm weather","p":"Stable pressure","wd":"Light wind","b":"Red worm (dung/earthworm), Bread crumb","tk":"Float rod, Light feeder","avg":"0.5-2 kg","rec":"4+ kg"},"ru":{"n":"Лобан (кефаль)","d":"Лобан — серебристая, торпедообразная рыба, заходящая из Чёрного моря в солоноватые воды — озеро Палиастоми и устья рек — для кормёжки. Передвигается стаями, часто выпрыгивает над поверхностью. Мясо вкусное и жирное.","m":"Июнь — ноябрь","h":"Утро и вечер","w":"Тёплая, тихая погода","p":"Стабильное давление","wd":"Лёгкий ветер","b":"Красный червь (навозный/земляной), Хлебный мякиш","tk":"Поплавочная снасть, Лёгкий фидер","avg":"0.5-2 кг","rec":"4+ кг"}},"carp":{"en":{"n":"Common Carp","d":"The carp is one of the most popular target fish in Georgia. It lives in lakes, reservoirs and slow-flowing rivers. It is a strong and wary fish — catching it takes patience. It is active in the warm season, especially at dawn and dusk.","m":"April – October (peak: May–June, September)","h":"Dawn (05:00-09:00) and evening (18:00-22:00)","w":"Warm, partly cloudy weather; becomes active after light rain","p":"Stable or slowly falling pressure (1010-1018 hPa)","wd":"Light southwest breeze; feeding improves on the windward shore","b":"Fermented corn (sweet), Boilie, Red worm (dung/earthworm)","tk":"Feeder, Carp rod, Method feeder","avg":"1-4 kg","rec":"25+ kg"},"ru":{"n":"Карп (сазан)","d":"Карп — одна из самых популярных целевых рыб в Грузии. Обитает в озёрах, водохранилищах и медленных реках. Сильная и осторожная рыба — для её поимки нужно терпение. Активен в тёплый сезон, особенно на рассвете и закате.","m":"Апрель — октябрь (пик: май–июнь, сентябрь)","h":"Рассвет (05:00-09:00) и вечер (18:00-22:00)","w":"Тёплая, переменная облачность; активизируется после лёгкого дождя","p":"Стабильное или медленно падающее давление (1010-1018 гПа)","wd":"Лёгкий юго-западный ветер; на наветренном берегу клёв лучше","b":"Ферментированная кукуруза (сладкая), Бойлы, Красный червь (навозный/земляной)","tk":"Фидер, Карповое удилище, Метод-фидер","avg":"1-4 кг","rec":"25+ кг"}},"catfish":{"en":{"n":"Wels Catfish","d":"The wels catfish is the largest freshwater fish in Georgia. It lives in the deep pools of rivers — the Mtkvari, Alazani and Rioni — as well as in large reservoirs. It is a nocturnal hunter. Catching it requires heavy tackle and patience.","m":"May – October (peak: June–August)","h":"Night (22:00-05:00), peak at dawn","w":"Warm, muggy nights; especially active before thunderstorms","p":"Low or sharply falling pressure","wd":"Wind matters less — warm water is key","b":"Red worm (dung/earthworm), Frog, Chicken liver","tk":"Heavy casting rod (100-300 g), Multiplier reel, Thick line","avg":"3-15 kg","rec":"80+ kg"},"ru":{"n":"Сом европейский","d":"Сом — крупнейшая пресноводная рыба Грузии. Обитает в глубоких ямах рек — Куры, Алазани и Риони — а также в крупных водохранилищах. Ночной хищник. Для его поимки нужна мощная снасть и терпение.","m":"Май — октябрь (пик: июнь–август)","h":"Ночь (22:00-05:00), пик на рассвете","w":"Тёплые, душные ночи; особенно активен перед грозой","p":"Низкое или резко падающее давление","wd":"Ветер менее важен — главное тёплая вода","b":"Красный червь (навозный/земляной), Лягушка, Куриная печень","tk":"Мощное удилище для заброса (100-300 г), Мультипликаторная катушка, Толстая леска","avg":"3-15 кг","rec":"80+ кг"}},"tench":{"en":{"n":"Tench","d":"The tench is a dark, golden-green fish with small scales and slimy skin. It favors warm lakes rich in vegetation and slow water, feeding on the bottom. It is a wary and strong fighter — catching it requires patience.","m":"May – September","h":"Dawn and evening","w":"Warm, calm weather","p":"Stable high pressure","wd":"Calm","b":"Red worm (dung/earthworm), Fermented corn (sweet), Boilie, Bread crumb","tk":"Feeder, Float rod","avg":"300-800 g","rec":"3+ kg"},"ru":{"n":"Линь","d":"Линь — тёмная, золотисто-зелёная рыба с мелкой чешуёй и слизистой кожей. Предпочитает тёплые озёра, богатые растительностью, и медленную воду, кормится у дна. Осторожный и сильный боец — для поимки нужно терпение.","m":"Май — сентябрь","h":"Рассвет и вечер","w":"Тёплая, тихая погода","p":"Стабильное высокое давление","wd":"Штиль","b":"Красный червь (навозный/земляной), Ферментированная кукуруза (сладкая), Бойлы, Хлебный мякиш","tk":"Фидер, Поплавочная удочка","avg":"300-800 г","rec":"3+ кг"}},"bluefish":{"en":{"n":"Bluefish","d":"An aggressive, fast predator with sharp cutting teeth. In autumn it chases schools of anchovy and horse mackerel near shore and often makes the water \"boil\" at the surface — this boiling gives away its location. It takes spoons and lures well and is a top target for spin fishermen on the Black Sea. Without a steel leader it cuts the line.","m":"August – November","h":"Morning and evening twilight","w":"Cloudy, light chop","p":"Falling","wd":"Moderate, onshore","b":"Spoon, Lure/wobbler, Soft plastic lure","tk":"Spinning rod (10-40 g), Steel leader mandatory","avg":"25-40 cm","rec":"70 cm"},"ru":{"n":"Луфарь","d":"Агрессивный, быстрый хищник с острыми режущими зубами. Осенью преследует у берега стаи хамсы и ставриды и часто заставляет воду «кипеть» на поверхности — именно это выдаёт его местонахождение. Хорошо берёт блёсны и воблеры и является главной целью спиннингистов на Чёрном море. Без стального поводка перекусывает леску.","m":"Август — ноябрь","h":"Утренние и вечерние сумерки","w":"Пасмурно, лёгкое волнение","p":"Падающее","wd":"Умеренный, в сторону берега","b":"Блесна, Воблер, Силиконовая приманка","tk":"Спиннинг (10-40 г), Стальной поводок обязателен","avg":"25-40 см","rec":"70 см"}},"whiting":{"en":{"n":"Black Sea Whiting","d":"A cold-water fish of the cod family — a separate subspecies lives in the Black Sea. In summer it moves into deep, cold layers; in winter, as the water cools, it comes closer to shore and is caught on bottom tackle. It readily takes lugworm, shrimp and pieces of anchovy. Its flesh is white and soft, with few bones.","m":"November – March","h":"Daytime hours","w":"Cold","p":"Stable","wd":"Light","b":"Ragworm","tk":"Bottom rig, Light bottom rig","avg":"15-25 cm","rec":"40 cm"},"ru":{"n":"Черноморский мерланг","d":"Холодноводная рыба семейства тресковых — в Чёрном море обитает отдельный подвид. Летом уходит в глубокие, холодные слои, зимой же, с похолоданием воды, подходит ближе к берегу и ловится на донную снасть. Хорошо берёт нереиса, креветку и кусочки хамсы. Мясо белое и мягкое, с небольшим количеством костей.","m":"Ноябрь — март","h":"Дневные часы","w":"Холодная","p":"Стабильное","wd":"Слабый","b":"Нереис","tk":"Донная снасть, Лёгкая донная снасть","avg":"15-25 см","rec":"40 см"}},"trout":{"en":{"n":"Brown Trout","d":"The trout inhabits fast, cold, crystal-clear mountain rivers. It is a symbol of Georgia's highlands — found in the upper reaches of the Aragvi, Enguri, Terek and Adjaristsqali. It is wary and fast — catching it is a true art.","m":"June – September (check licensing rules)","h":"Morning (06:00-10:00) and evening (17:00-20:00)","w":"Cool, cloudy days; slightly murky water after rain is ideal","p":"High stable pressure in mountain conditions","wd":"Wind matters less in narrow gorges","b":"Spoon, Lure/wobbler","tk":"Ultralight spinning (1-7 g), Fly rod (fly fishing)","avg":"200-600 g","rec":"3+ kg"},"ru":{"n":"Ручьевая форель","d":"Форель обитает в быстрых, холодных, кристально чистых горных реках. Символ высокогорья Грузии — встречается в верховьях Арагви, Ингури, Терека и Аджарисцкали. Осторожна и быстра — её поимка настоящее искусство.","m":"Июнь — сентябрь (уточняйте правила лицензии)","h":"Утро (06:00-10:00) и вечер (17:00-20:00)","w":"Прохладные, пасмурные дни; слегка мутная вода после дождя идеальна","p":"Высокое стабильное давление в горных условиях","wd":"Ветер менее важен в узких ущельях","b":"Блесна, Воблер","tk":"Ультралёгкий спиннинг (1-7 г), Нахлыстовое удилище (fly fishing)","avg":"200-600 г","rec":"3+ кг"}},"garfish":{"en":{"n":"Garfish","d":"A surface fish with a long, snake-like body and a sharp, beak-like jaw. Its bones are greenish — surprising to many, though entirely harmless. In spring and autumn it comes close to shore and hunts small fish near the surface.","m":"April – June and September – November","h":"Daytime hours","w":"Sunny, calm","p":"Stable","wd":"Light","b":"Spoon","tk":"Light spinning (2-10 g), Float rod","avg":"40-60 cm","rec":"90 cm"},"ru":{"n":"Сарган","d":"Поверхностная рыба с длинным, змеевидным телом и острыми, клювовидными челюстями. Её кости зеленоватые — многих это удивляет, хотя совершенно безвредно. Весной и осенью подходит близко к берегу и охотится на мелкую рыбу у поверхности.","m":"Апрель — июнь и сентябрь — ноябрь","h":"Дневные часы","w":"Солнечно, тихо","p":"Стабильное","wd":"Слабый","b":"Блесна","tk":"Лёгкий спиннинг (2-10 г), Поплавочная снасть","avg":"40-60 см","rec":"90 см"}},"whitefish":{"en":{"n":"Whitefish","d":"The whitefish is a cold, clean-water fish. In Georgia it was introduced into the high-mountain lakes of Javakheti — Paravani and Tabatskuri — and has established itself well. It is a silvery fish with delicate flesh. It is caught in deep cold water, often through ice.","m":"October – March (peak: winter)","h":"Morning and daytime hours","w":"Cold, clear weather; under ice in winter","p":"High, stable pressure","wd":"Light wind","b":"Bloodworm/maggot, Spoon","tk":"Ice rod, Light float rod","avg":"300-800 g","rec":"3+ kg"},"ru":{"n":"Сиг","d":"Сиг — рыба холодной, чистой воды. В Грузию был интродуцирован в высокогорные озёра Джавахети — Паравани и Табацкури — и хорошо прижился. Серебристая рыба с нежным мясом. Ловится в глубокой холодной воде, часто со льда.","m":"Октябрь — март (пик: зима)","h":"Утро и дневные часы","w":"Холодная, ясная погода; зимой подо льдом","p":"Высокое, стабильное давление","wd":"Лёгкий ветер","b":"Мотыль, Блесна","tk":"Зимняя удочка, Лёгкая поплавочная снасть","avg":"300-800 г","rec":"3+ кг"}},"horse_mackerel":{"en":{"n":"Mediterranean Horse Mackerel","d":"A fast, schooling predator — bluish on the back, silvery on the sides, with a row of sharp bony scutes along the lateral line. In summer and autumn it comes close to shore and hunts actively in the evenings in the lit waters of harbors. It is one of the most frequently caught fish off Batumi and Kobuleti.","m":"June – November","h":"Dusk and night","w":"Calm, warm","p":"Stable","wd":"Light","b":"Soft plastic lure","tk":"Light spinning (2-10 g), Multi-hook rig (sabiki)","avg":"12-20 cm","rec":"35 cm"},"ru":{"n":"Ставрида средиземноморская","d":"Быстрый стайный хищник — спина голубоватая, бока серебристые, вдоль боковой линии тянется ряд острых костных щитков. Летом и осенью подходит близко к берегу и активно охотится вечерами в освещённой воде портов. Одна из самых часто вылавливаемых рыб в районе Батуми и Кобулети.","m":"Июнь — ноябрь","h":"Закат и ночь","w":"Тихая, тёплая","p":"Стабильное","wd":"Слабый","b":"Силиконовая приманка","tk":"Лёгкий спиннинг (2-10 г), Многокрючковая оснастка (сабики)","avg":"12-20 см","rec":"35 см"}},"silver_carp":{"en":{"n":"Silver Carp","d":"The silver carp is a large plankton-feeding fish. It lives in large reservoirs — Jandari, Sioni and the Tbilisi Sea. It is caught with special tackle (technoplankton rig). It is a very strong fighter.","m":"June – September","h":"Warm daytime hours","w":"Hot, calm days — comes close to the surface","p":"High pressure","wd":"Calm","b":"","tk":"Heavy casting rod with special rig","avg":"2-8 kg","rec":"40+ kg"},"ru":{"n":"Толстолобик","d":"Толстолобик — крупная рыба, питающаяся планктоном. Обитает в крупных водохранилищах — Джандари, Сиони и Тбилисском море. Ловится на специальную снасть (технопланктон). Очень сильный боец.","m":"Июнь — сентябрь","h":"Тёплые дневные часы","w":"Жаркие, тихие дни — подходит близко к поверхности","p":"Высокое давление","wd":"Штиль","b":"","tk":"Мощное удилище для заброса со специальной оснасткой","avg":"2-8 кг","rec":"40+ кг"}},"roach":{"en":{"n":"Roach","d":"The roach is one of the most widespread freshwater fish. It is hardy and undemanding — living in lakes, reservoirs and slow-flowing rivers. It is active all year round, even in winter. An excellent choice for beginner anglers.","m":"All year (peak: spring and autumn)","h":"Morning and evening","w":"Almost any; better on cloudy days","p":"Stable or slowly falling pressure","wd":"Light or moderate wind","b":"Bloodworm/maggot, Red worm (dung/earthworm), Bread crumb, Semolina paste","tk":"Float rod, Light feeder","avg":"100-300 g","rec":"1.5+ kg"},"ru":{"n":"Плотва","d":"Плотва — одна из самых распространённых пресноводных рыб. Вынослива и неприхотлива — обитает в озёрах, водохранилищах и медленных реках. Активна круглый год, даже зимой. Отличный выбор для начинающих рыболовов.","m":"Круглый год (пик: весна и осень)","h":"Утро и вечер","w":"Почти любая; лучше в пасмурные дни","p":"Стабильное или медленно падающее давление","wd":"Лёгкий или умеренный ветер","b":"Опарыш, Красный червь (навозный/земляной), Хлебный мякиш, Манная болтушка","tk":"Поплавочная снасть, Лёгкий фидер","avg":"100-300 г","rec":"1.5+ кг"}},"zander":{"en":{"n":"Zander (Pikeperch)","d":"The zander is a valuable predator that prefers clean, oxygen-rich water. It lives in large reservoirs and rivers. It hunts at night — the best target for jig fishing.","m":"September – May (peak: October–November, March)","h":"Dusk and night (19:00-24:00), dawn","w":"Cool, clear or partly cloudy weather","p":"Stable high pressure","wd":"Light or moderate wind","b":"Soft plastic lure, Lure/wobbler","tk":"Jig spinning (5-25 g), Sensitive tip","avg":"0.5-2 kg","rec":"10+ kg"},"ru":{"n":"Судак","d":"Судак — ценный хищник, предпочитающий чистую, насыщенную кислородом воду. Обитает в крупных водохранилищах и реках. Охотится ночью — лучшая цель для джиговой ловли.","m":"Сентябрь — май (пик: октябрь–ноябрь, март)","h":"Сумерки и ночь (19:00-24:00), рассвет","w":"Прохладная, ясная или переменная облачность","p":"Стабильное высокое давление","wd":"Лёгкий или умеренный ветер","b":"Силиконовая приманка, Воблер","tk":"Джиг-спиннинг (5-25 г), Чувствительный кончик","avg":"0.5-2 кг","rec":"10+ кг"}},"rudd":{"en":{"n":"Rudd","d":"The rudd is a beautiful, silvery-golden fish with characteristic red fins and eyes. It lives in lakes rich in vegetation and slow-flowing waters. It lives in schools, often feeding close to the surface. An ideal target for calm, enjoyable fishing.","m":"April – October","h":"Morning (07:00-11:00) and evening","w":"Warm, calm, sunny weather","p":"Stable pressure","wd":"Calm or light breeze","b":"Bloodworm/maggot, Bread crumb, Fermented corn (sweet), Red worm (dung/earthworm)","tk":"Float rod, Light match rod","avg":"100-400 g","rec":"1.5+ kg"},"ru":{"n":"Красноперка","d":"Красноперка — красивая, серебристо-золотистая рыба с характерными красными плавниками и глазами. Обитает в богатых растительностью озёрах и медленных водах. Живёт стаями, часто кормится близко к поверхности. Идеальная цель для спокойной, приятной рыбалки.","m":"Апрель — октябрь","h":"Утро (07:00-11:00) и вечер","w":"Тёплая, тихая, солнечная погода","p":"Стабильное давление","wd":"Штиль или лёгкий ветерок","b":"Опарыш, Хлебный мякиш, Ферментированная кукуруза (сладкая), Красный червь (навозный/земляной)","tk":"Поплавочная снасть, Лёгкая матчевая удочка","avg function layoutNav(){
 const nav=$('#nav'),more=$('#navMore'),menu=$('#navMoreMenu');
 if(!nav||!more||!menu)return;
 const btns=[...nav.querySelectorAll(':scope>button[data-k]')];
 if(!btns.length)return;
 btns.forEach(b=>b.style.display='');
 more.removeAttribute('data-show');
 setNavMoreOpen(false);menu.innerHTML='';
 const avail=nav.clientWidth;
 const gap=2;
 const widths=btns.map(b=>b.getBoundingClientRect().width);
 const total=widths.reduce((a,b)=>a+b,0)+gap*(btns.length-1);
 if(total<=avail+1)return;
 more.setAttribute('data-show','1');
 const moreW=more.getBoundingClientRect().width+gap;
 let used=0,cut=-1;
 for(let i=0;i<btns.length;i++){
  used+=widths[i]+(i>0?gap:0);
  if(used+moreW>avail){cut=i;break}
 }
 if(cut<0)cut=btns.length;
 const hidden=btns.slice(cut);
 if(!hidden.length){more.removeAttribute('data-show');return}
 hidden.forEach(b=>b.style.display='none');
 menu.innerHTML=hidden.map(b=>{const k=b.dataset.k;return `<button type="button" data-k="${k}" class="${b.classList.contains('on')?'on':''}">${NAV_ICONS[k]||''}<span>${tabLabel(k)}</span></button>`}).join('');
}
